<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=Cairo:wght@400;600&display=swap">

<style>
:root {
  box-sizing: border-box;
  --wall: #2a0712;
  --wall2: #4a0c20;
  --cream: #f4e8e2;
  --plaque: #f4e8e2;
  --plaque-ink: #2a0712;
  --plaque-mute: #7a4a58;
  --brass: #c9a46a;
  --rose: #e8a0b4;
  --text: #f4e8e2;
  --mute: #d6aab7;
}

*, *::before, *::after {
  box-sizing: border-box;
}

body {
  margin: 0;
  color: var(--text);
  font-family: "Cairo", system-ui, sans-serif;
  line-height: 1.7;
  background:
    radial-gradient(ellipse 80% 50% at 50% 0, var(--wall2), transparent 70%),
    var(--wall);
  min-height: 100vh;
}

header {
  text-align: center;
  padding: 72px 20px 36px;
  position: relative;
}

header h1 {
  font-family: "Reem Kufi", "Cairo", sans-serif;
  font-weight: 700;
  margin: 0;
  direction: ltr;
  line-height: 1;
  font-size: clamp(3.2rem, 15vw, 9rem);
  letter-spacing: .02em;
  color: var(--text);
  animation: rise .9s cubic-bezier(.2,.7,.2,1) both;
}

header h1::after {
  content: "";
  display: block;
  width: min(240px, 50%);
  height: 3px;
  margin: 18px auto 0;
  background: linear-gradient(90deg, transparent, var(--brass), transparent);
}

header p {
  margin: 14px auto 0;
  max-width: 36ch;
  color: var(--mute);
  font-size: 1.05rem;
  animation: rise .9s .2s cubic-bezier(.2,.7,.2,1) both;
}

@keyframes rise {
  from {
    opacity: 0;
    transform: translateY(24px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

main {
  max-width: 1180px;
  margin: 0 auto;
  padding: 28px 18px 40px;
}

.grid {
  columns: 3 260px;
  column-gap: 22px;
}

.card {
  margin: 0 0 22px;
  break-inside: avoid;
  cursor: zoom-in;
  position: relative;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(0,0,0,.3);
  transition: transform .35s cubic-bezier(.2,.7,.2,1);
}

.card:hover {
  transform: translateY(-4px);
}

.card:focus-visible {
  outline: none;
}

.card:focus-visible .frame {
  outline: 3px solid var(--brass);
  outline-offset: 4px;
}

.frame {
  border-radius: 18px 18px 0 0;
  overflow: hidden;
}

.frame img {
  display: block;
  width: 100%;
  height: auto;
}

figcaption {
  padding: 14px 16px 16px;
  border-radius: 0 0 18px 18px;
  background: #4a0c20;
  color: #f8ece8;
}

figcaption h2 {
  margin: 0;
  font-family: "Reem Kufi", "Cairo", sans-serif;
  font-size: 1.35rem;
  line-height: 1.3;
  color: #f4d9a8;
}

figcaption p {
  margin: 2px 0 0;
  font-size: .95rem;
  color: #f0d3db;
}

footer {
  text-align: center;
  padding: 30px 16px 44px;
  color: var(--mute);
}

footer .sig {
  display: inline-block;
  direction: ltr;
  unicode-bidi: isolate;
  font-family: "Reem Kufi", sans-serif;
  font-size: 1.5rem;
  color: var(--text);
  border-top: 1px solid var(--brass);
  padding-top: 10px;
  margin-top: 6px;
}

#lb {
  position: fixed;
  inset: 0;
  background: rgba(18,2,7,.94);
  display: none;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  padding: 24px 56px;
  z-index: 20;
  text-align: center;
  color: #f4e8e2;
}

#lb.on {
  display: flex;
}

#lb img {
  max-width: 100%;
  max-height: 76vh;
  border: 10px solid #f4e8e2;
  border-radius: 3px;
  box-shadow: 0 20px 60px rgba(0,0,0,.6);
}

#lb h3 {
  font-family: "Reem Kufi", sans-serif;
  margin: 16px 0 0;
  font-size: 1.5rem;
}

#lb p {
  margin: 0;
  color: #e3b9c5;
}

#lb button {
  position: absolute;
  background: none;
  border: 1px solid #c9a46a;
  color: #f4e8e2;
  width: 44px;
  height: 44px;
  border-radius: 50%;
  font-size: 1.4rem;
  cursor: pointer;
}

#lb button:hover,
#lb button:focus-visible {
  background: #c9a46a;
  color: #2a0712;
  outline: none;
}

#nx { left: 10px; top: 50%; }
#pv { right: 10px; top: 50%; }
#cl { top: 12px; left: 12px; }

@media (max-width: 900px) {
  .grid { columns: 2; }
}

@media (max-width: 560px) {
  header { padding: 40px 16px 22px; }
  header p { font-size: .95rem; }
  main { padding: 14px 14px 28px; }
  .grid { columns: 1; }
  figcaption h2 { font-size: 1.2rem; }
  #lb { padding: 60px 10px 96px; }
  #lb img { border-width: 6px; max-height: 62vh; }
  #nx, #pv {
    top: auto;
    bottom: 28px;
    width: 52px;
    height: 52px;
  }
  #nx { left: calc(50% - 64px); }
  #pv { right: calc(50% - 64px); }
}

@media (prefers-reduced-motion: reduce) {
  * {
    transition: none !important;
    animation: none !important;
  }
  .card { transform: none !important; }
}
</style>
</head>

  <button id="nx" aria-label="التالية">‹</button>
  <button id="pv" aria-label="السابقة">›</button>
  <img alt="">
  <h3></h3>

<script>
const cs = [...document.querySelectorAll('.card')];
const lb = document.getElementById('lb');
const li = lb.querySelector('img');
const lh = lb.querySelector('h3');
const lp = lb.querySelector('p');

let i = 0;

function show(n) {
  i = (n + cs.length) % cs.length;
  const c = cs[i];

  li.src = c.querySelector('img').src;
  lh.textContent = c.querySelector('h2').textContent;
  lp.textContent = c.querySelector('p').textContent;

  lb.classList.add('on');
}

cs.forEach((c, n) => {
  c.tabIndex = 0;

  c.addEventListener('click', () => show(n));

  c.addEventListener('keydown', e => {
    if (e.key === 'Enter') show(n);
  });
});

document.getElementById('cl').onclick = () => {
  lb.classList.remove('on');
};

document.getElementById('nx').onclick = e => {
  e.stopPropagation();
  show(i + 1);
};

document.getElementById('pv').onclick = e => {
  e.stopPropagation();
  show(i - 1);
};

lb.addEventListener('click', e => {
  if (e.target === lb) {
    lb.classList.remove('on');
  }
});

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('on')) return;

  if (e.key === 'Escape') lb.classList.remove('on');
  if (e.key === 'ArrowLeft') show(i + 1);
  if (e.key === 'ArrowRight') show(i - 1);
});

let sx = null;

lb.addEventListener('touchstart', e => {
  sx = e.touches[0].clientX;
});

lb.addEventListener('touchend', e => {
  if (sx === null) return;

  const d = e.changedTouches[0].clientX - sx;

  if (Math.abs(d) > 50) {
    show(d < 0 ? i + 1 : i - 1);
  }

  sx = null;
});
</script>
